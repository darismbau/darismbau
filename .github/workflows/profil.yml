# Met à jour le graphe de contributions chaque jour (et à chaque modification des scripts)
name: Profil
on:
  schedule: [{cron: "17 6 * * *"}]
  workflow_dispatch:
  push: {paths: ["scripts/faire_heatmap.py", ".github/workflows/profil.yml"]}
permissions: {contents: write}
jobs:
  graphe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/faire_heatmap.py ${{ github.repository_owner }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg data/contributions.json
          git diff --cached --quiet || (git commit -m "chore: maj du graphe de contributions [skip ci]" && git push)
